services:
  hexo:
    build: .
    image: my-hexo
    container_name: hexo-blog
    working_dir: /app
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - hexo_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    command: bash -lc "hexo server --host 0.0.0.0"

volumes:
  hexo_node_modules:
